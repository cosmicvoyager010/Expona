<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Expona — Journey of Exponential Scales</title>

  <!-- PWA Manifest & iOS Web App Meta Tags -->
  <link rel="manifest" href="manifest.json">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Expona">
  <meta name="theme-color" content="#030712">

  <style>
    /* Reset & Base Styles */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #030712;
      color: #f0f4f8;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      overflow-x: hidden;
      min-height: 200vh;
    }

    /* WebGL Canvas Background */
    #bg-canvas {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: -1;
    }

    /* Glassmorphic Landing Hero Overlay */
    .hero-overlay {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 2000;
      background: radial-gradient(circle at center, rgba(15, 23, 42, 0.4) 0%, rgba(3, 7, 18, 0.9) 100%);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      transition: opacity 0.8s ease, visibility 0.8s;
      text-align: center;
      padding: 1.5rem;
    }

    .hero-overlay.launched {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .hero-title {
      font-size: clamp(2.5rem, 6vw, 5rem);
      font-weight: 800;
      letter-spacing: -0.03em;
      background: linear-gradient(135deg, #ffffff 0%, #a5f3fc 50%, #38bdf8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 0.75rem;
      text-shadow: 0 0 30px rgba(56, 189, 248, 0.3);
    }

    .hero-subtitle {
      color: rgba(255, 255, 255, 0.7);
      margin-bottom: 2rem;
      font-size: 1.1rem;
    }

    .start-btn {
      padding: 1rem 2.5rem;
      font-size: 1.1rem;
      font-weight: 600;
      color: #fff;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 9999px;
      cursor: pointer;
      box-shadow: 0 0 20px rgba(56, 189, 248, 0.2), inset 0 0 15px rgba(255, 255, 255, 0.1);
      transition: all 0.3s ease;
      touch-action: manipulation;
    }

    .start-btn:hover {
      transform: scale(1.05);
      background: rgba(56, 189, 248, 0.2);
      border-color: #38bdf8;
      box-shadow: 0 0 35px rgba(56, 189, 248, 0.5);
    }

    /* Interactive Scene Cards */
    .content-stage {
      padding: 100vh 2rem 20vh;
      max-width: 800px;
      margin: 0 auto;
    }

    .stage-card {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      padding: 2rem;
      border-radius: 16px;
      margin-bottom: 40vh;
      cursor: pointer;
      transition: transform 0.3s ease, border-color 0.3s ease;
      touch-action: manipulation;
    }

    .stage-card:hover {
      transform: translateY(-5px);
      border-color: rgba(56, 189, 248, 0.4);
    }

    /* Side Drawer Backdrop */
    .drawer-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s ease;
      z-index: 999;
    }

    .drawer-backdrop.active {
      opacity: 1;
      pointer-events: auto;
    }

    /* Glassmorphic Side Drawer */
    .summary-drawer {
      position: fixed;
      top: 0;
      right: 0;
      width: 100%;
      max-width: 420px;
      height: 100vh;
      height: 100dvh;
      z-index: 1000;
      background: rgba(20, 24, 35, 0.75);
      backdrop-filter: blur(16px) saturate(180%);
      -webkit-backdrop-filter: blur(16px) saturate(180%);
      border-left: 1px solid rgba(255, 255, 255, 0.125);
      box-shadow: -10px 0 30px rgba(0, 0, 0, 0.37);
      padding: 2.5rem 2rem;
      overflow-y: auto;
      transform: translateX(100%);
      transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .summary-drawer.open {
      transform: translateX(0);
    }

    .close-btn {
      position: absolute;
      top: 1.25rem;
      right: 1.25rem;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #fff;
      font-size: 1.5rem;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .category-tag {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: #60a5fa;
    }

    .drawer-title {
      font-size: 1.75rem;
      margin: 0.5rem 0 1rem;
    }

    .fact-card {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      padding: 1.25rem;
      margin-top: 1rem;
    }
  </style>
</head>
<body>

  <!-- WebGL Background Canvas -->
  <canvas id="bg-canvas"></canvas>

  <!-- Hero Start Screen -->
  <div id="hero" class="hero-overlay">
    <h1 class="hero-title">EXPONA</h1>
    <p class="hero-subtitle">Journey Through Exponential Scales of Existence</p>
    <button class="start-btn" id="start-btn">Launch Expona</button>
  </div>

  <!-- Content Stage -->
  <main class="content-stage">
    <div class="stage-card" data-title="Low Earth Orbit" data-scale="10⁶ m" data-summary="Home to human satellites and space stations orbiting high above the atmosphere.">
      <span class="category-tag">Scale • 10⁶ m</span>
      <h2 style="margin-top: 0.25rem;">Low Earth Orbit</h2>
      <p style="color: rgba(255,255,255,0.7); margin-top: 0.5rem;">Tap to inspect details and scale parameters.</p>
    </div>

    <div class="stage-card" data-title="Jupiter System" data-scale="10¹² m" data-summary="The largest gas giant in our solar system, acting as a gravitational anchor for dozens of moons.">
      <span class="category-tag">Scale • 10¹² m</span>
      <h2 style="margin-top: 0.25rem;">Jupiter System</h2>
      <p style="color: rgba(255,255,255,0.7); margin-top: 0.5rem;">Tap to inspect details and scale parameters.</p>
    </div>
  </main>

  <!-- Side Drawer Component -->
  <div id="drawer-backdrop" class="drawer-backdrop"></div>
  <aside id="summary-drawer" class="summary-drawer" aria-hidden="true">
    <button class="close-btn" id="drawer-close">&times;</button>
    <span class="category-tag" id="drawer-scale">Scale</span>
    <h2 class="drawer-title" id="drawer-title">Title</h2>
    <p id="drawer-summary" style="line-height: 1.6; color: rgba(240, 244, 248, 0.85);"></p>
    
    <div class="fact-card">
      <h3 style="font-size: 0.9rem; color: #93c5fd; margin-bottom: 0.5rem;">Scale Insights</h3>
      <p style="font-size: 0.95rem; line-height: 1.5; color: rgba(240, 244, 248, 0.8);">Interactive perspective data rendered in real-time.</p>
    </div>
  </aside>

  <script>
    // WebGL Particle Starfield Engine
    (function initParticleCanvas() {
      const canvas = document.getElementById('bg-canvas');
      const gl = canvas.getContext('webgl');
      if (!gl) return;

      const vsSource = `
        attribute vec3 aPosition;
        attribute float aSize;
        attribute float aAlpha;
        uniform float uTime;
        varying float vAlpha;
        void main() {
          vec3 pos = aPosition;
          pos.y += sin(uTime * 0.5 + pos.x * 10.0) * 0.02;
          pos.x += cos(uTime * 0.3 + pos.y * 10.0) * 0.02;
          gl_Position = vec4(pos, 1.0);
          gl_PointSize = aSize;
          vAlpha = aAlpha;
        }
      `;

      const fsSource = `
        precision mediump float;
        varying float vAlpha;
        void main() {
          float dist = length(gl_PointCoord - vec2(0.5));
          if (dist > 0.5) discard;
          float alpha = smoothstep(0.5, 0.0, dist) * vAlpha;
          gl_FragColor = vec4(0.56, 0.85, 1.0, alpha);
        }
      `;

      function createShader(gl, type, source) {
        const shader = gl.createShader(type);
        gl.shaderSource(shader, source);
        gl.compileShader(shader);
        return shader;
      }

      const program = gl.createProgram();
      gl.attachShader(program, createShader(gl, gl.VERTEX_SHADER, vsSource));
      gl.attachShader(program, createShader(gl, gl.FRAGMENT_SHADER, fsSource));
      gl.linkProgram(program);
      gl.useProgram(program);

      const PARTICLE_COUNT = 300;
      const positions = new Float32Array(PARTICLE_COUNT * 3);
      const sizes = new Float32Array(PARTICLE_COUNT);
      const alphas = new Float32Array(PARTICLE_COUNT);

      for (let i = 0; i < PARTICLE_COUNT; i++) {
        positions[i * 3] = (Math.random() - 0.5) * 2.0;
        positions[i * 3 + 1] = (Math.random() - 0.5) * 2.0;
        positions[i * 3 + 2] = Math.random();
        sizes[i] = Math.random() * 4.0 + 1.5;
        alphas[i] = Math.random() * 0.7 + 0.3;
      }

      function bindBuffer(data, loc, size) {
        const buffer = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
        gl.bufferData(gl.ARRAY_BUFFER, data, gl.STATIC_DRAW);
        gl.enableVertexAttribArray(loc);
        gl.vertexAttribPointer(loc, size, gl.FLOAT, false, 0, 0);
      }

      bindBuffer(positions, gl.getAttribLocation(program, 'aPosition'), 3);
      bindBuffer(sizes, gl.getAttribLocation(program, 'aSize'), 1);
      bindBuffer(alphas, gl.getAttribLocation(program, 'aAlpha'), 1);

      const uTimeLoc = gl.getUniformLocation(program, 'uTime');

      function resize() {
        canvas.width = window.innerWidth * window.devicePixelRatio;
        canvas.height = window.innerHeight * window.devicePixelRatio;
        gl.viewport(0, 0, canvas.width, canvas.height);
      }
      window.addEventListener('resize', resize);
      resize();

      gl.enable(gl.BLEND);
      gl.blendFunc(gl.SRC_ALPHA, gl.ONE);

      function render(time) {
        gl.clearColor(0.01, 0.03, 0.08, 0.0);
        gl.clear(gl.COLOR_BUFFER_BIT);
        gl.uniform1f(uTimeLoc, time * 0.001);
        gl.drawArrays(gl.POINTS, 0, PARTICLE_COUNT);
        requestAnimationFrame(render);
      }
      requestAnimationFrame(render);
    })();

    // UI Event Listeners
    const hero = document.getElementById('hero');
    const startBtn = document.getElementById('start-btn');
    const drawer = document.getElementById('summary-drawer');
    const backdrop = document.getElementById('drawer-backdrop');
    const closeBtn = document.getElementById('drawer-close');

    startBtn.addEventListener('click', () => {
      hero.classList.add('launched');
    });

    function openDrawer(card) {
      document.getElementById('drawer-title').innerText = card.dataset.title;
      document.getElementById('drawer-scale').innerText = `Scale • ${card.dataset.scale}`;
      document.getElementById('drawer-summary').innerText = card.dataset.summary;

      drawer.classList.add('open');
      backdrop.classList.add('active');
    }

    function closeDrawer() {
      drawer.classList.remove('open');
      backdrop.classList.remove('active');
    }

    document.querySelectorAll('.stage-card').forEach(card => {
      card.addEventListener('click', () => openDrawer(card));
    });

    closeBtn.addEventListener('click', closeDrawer);
    backdrop.addEventListener('click', closeDrawer);
  </script>
</body>
</html>
